# List of personal or academic projects
# Feel free to add more projects
highlighted_projects:
    #project name
    - name: "Credit Scoring ML"
      description: "Built an end-to-end credit default prediction project using the Home Credit dataset, including EDA, missing-value handling, financial feature engineering, Scikit-learn model comparison, financial metric evaluation, SHAP-based explainability, and PSI monitoring."
    - name: "Stock Analytics Pipeline"
      description: "Developed a reusable Databricks data platform solution using Lakeflow Declarative Pipelines and a medallion architecture to ingest, validate, standardize, and transform stock API data across Bronze, Silver, and Gold Delta tables. Implemented incremental ingestion, data-quality expectations, deduplication, and automated workflow orchestration to create reliable and governed datasets in Unity Catalog. Engineered reusable analytical features, including 7-, 30-, and 90-day price-change and volume-trend metrics, and delivered interactive Databricks dashboards with dynamic filters for downstream users. Independently researched unfamiliar Databricks capabilities, resolved storage-access and pipeline-design challenges, and documented the solution for future reuse and extension."
    - name : "Fitness Cloud Data Platform"
      description: "Joined an in-progress AWS migration project on short notice and independently ramped up on the AWS ecosystem to support delivery after a team member unexpectedly left. Developed modular ETL pipelines with AWS Glue and PySpark to process historical and streaming CSV/JSON data from Amazon S3 into curated Aurora MySQL tables covering customer profiles, class schedules, attendance, engagement, lifecycle segmentation, and churn-prediction features. Orchestrated daily and weekly workflows using EventBridge-triggered AWS Lambda functions, built an interactive Streamlit dashboard to visualize signup trends, popular classes, instructors, and churn patterns, and implemented an Amazon SES?based email campaign system that sent personalized onboarding and re-engagement messages while preventing duplicate communications within 30 days."


